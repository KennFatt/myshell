<style>
  /* Toggleable TOC: button sits in the TOC heading, collapsed state
     hides the list. Frees sidebar space for wide tables. */
  #TOC h1,
  #TOC .toc-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
  }
  #TOC h1 {
    font-family: var(--font-sans);
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin: 0 0 0.6rem;
  }
  #TOC .toc-header {
    font-family: var(--font-sans);
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin: 0 0 0.6rem;
  }
  #toc-toggle {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.75rem;
    height: 1.75rem;
    padding: 0;
    border: 1px solid var(--border, #e3e1db);
    border-radius: 999px;
    background: transparent;
    color: var(--muted, #5a5a57);
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
    transition: color 0.15s, border-color 0.15s;
  }
  #toc-toggle:hover {
    color: var(--accent, #b84800);
    border-color: var(--accent, #b84800);
  }
  #TOC.is-collapsed ul {
    display: none;
  }
  #TOC.is-collapsed h1,
  #TOC.is-collapsed .toc-header {
    margin-bottom: 0;
  }
  @media (min-width: 1280px) {
    #TOC.is-collapsed {
      width: auto;
      max-height: none;
    }
  }
  @media print {
    #toc-toggle {
      display: none !important;
    }
    #TOC ul {
      display: block !important;
    }
  }
</style>
<script>
(function () {
  "use strict";

  var STORAGE_KEY = "pandoc-toc-collapsed";

  function readPreference() {
    try {
      return localStorage.getItem(STORAGE_KEY) === "1";
    } catch (e) {
      return false;
    }
  }

  function storePreference(collapsed) {
    try {
      localStorage.setItem(STORAGE_KEY, collapsed ? "1" : "0");
    } catch (e) {
      /* ignore write failures */
    }
  }

  function setCollapsed(nav, collapsed) {
    nav.classList.toggle("is-collapsed", collapsed);
    var button = nav.querySelector("#toc-toggle");
    if (button) {
      button.textContent = collapsed ? "+" : "-";
      button.setAttribute("aria-expanded", String(!collapsed));
      button.setAttribute(
        "aria-label",
        collapsed ? "Show table of contents" : "Hide table of contents"
      );
      button.title = collapsed
        ? "Show table of contents"
        : "Hide table of contents";
    }
  }

  function initializeTocToggle() {
    var nav = document.getElementById("TOC");
    if (!nav || nav.querySelector("#toc-toggle")) {
      return;
    }
    var heading = nav.querySelector("h1, .toc-header");
    if (!heading) {
      heading = document.createElement("div");
      heading.className = "toc-header";
      var label = document.createElement("span");
      label.textContent = "Contents";
      heading.appendChild(label);
      nav.insertBefore(heading, nav.firstChild);
    }

    var button = document.createElement("button");
    button.type = "button";
    button.id = "toc-toggle";
    button.setAttribute("aria-controls", "TOC");
    button.addEventListener("click", function () {
      var collapsed = !nav.classList.contains("is-collapsed");
      setCollapsed(nav, collapsed);
      storePreference(collapsed);
    });
    heading.appendChild(button);

    setCollapsed(nav, readPreference());
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initializeTocToggle);
  } else {
    initializeTocToggle();
  }
})();
</script>
